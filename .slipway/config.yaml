# Written by /slipway:bootstrap on 2026-09-13 from the intake interview. Single source of truth for slipway skills.
schema_version: 1

project:
  name: adlc-demo
  description: Demo monorepo (.NET 8 API + React/Vite frontend) delivered by the slipway plugin

options:
  cloud: azure
  compute: aca
  registry: acr
  runner: github-actions
  versioning: nbgv
  branching: trunk
  tracker: jira
  secret_store: azure-key-vault
  base_image: dhi

azure:
  # subscription_id / tenant_id intentionally omitted (public repo): set ARM_SUBSCRIPTION_ID / ARM_TENANT_ID locally
  # (az account set) and AZURE_SUBSCRIPTION_ID / AZURE_TENANT_ID as GitHub secrets.
  location: westeurope
  resource_group: rg-adlc-demo-dev
  acr_name: acradlcdemo
  key_vault_name: kv-adlc-demo-dev
  identity_name: id-adlc-demo-dev
  state:
    resource_group: rg-slipway-tfstate
    storage_account: stadlctfstate
    container: tfstate

github:
  owner: integranz
  repo: slipway-demo
  default_branch: main
  cd_environment: dev

jira:
  site_url: https://integranz.atlassian.net
  project_key: DEVOPS
  issue_type: Story
  transitions:
    start: In Progress
    review: In Review
    done: Done

environments: [dev]

apps:
  - name: api
    path: apps/api
    kind: api
    stack: dotnet8-api
    port: 8080
    health_path: /health
    test_command: dotnet test apps/api
    image_repository: adlc-demo/api
  - name: web
    path: apps/web
    kind: frontend
    stack: react-vite
    port: 8080
    health_path: /
    test_command: npm --prefix apps/web test
    image_repository: adlc-demo/web
    upstreams: [api]

cursor_mirror: false
