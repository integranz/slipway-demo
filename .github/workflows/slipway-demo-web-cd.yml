# Generated by slipway for app `web` (runner=github-actions, cd_trigger=on-ci-success). Regenerate with the scaffold; do not hand-edit.
# CD of ONE app: deploy one immutable tag of `web` to one environment through the stages in _cd.yml (plan, human approval, apply, smoke).
# Starts automatically when slipway-demo-web-ci succeeds on main (target: dev; the tag is read from
# that run's release manifest, since workflow_run cannot carry inputs) and on demand with `/slipway:deploy web <tag> <env>`.
name: slipway-demo-web-cd

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag of web from slipway-demo-web-ci (semver, e.g. 0.2.3)
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
  workflow_run:
    workflows: ["slipway-demo-web-ci"]
    types: [completed]
    branches: [main]

concurrency:
  group: slipway-demo-web-cd-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read   # read the release manifest artifact of the CI run

jobs:
  resolve:
    name: web resolve
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      environment: ${{ steps.r.outputs.environment }}
    steps:
      - name: Read the release manifest of the CI run that completed
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          pattern: release-manifest-web-*
          merge-multiple: true
          path: manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: r
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            [ -f manifest/release-manifest.json ] || { echo "::error::CI run ${{ github.event.workflow_run.id }} published no release manifest for web (no release job on that run); nothing to deploy"; exit 1; }
            TAG=$(python3 -c 'import json; print(json.load(open("manifest/release-manifest.json"))["version"])')
            ENV="dev"
          else
            TAG="${{ inputs.tag }}"; ENV="${{ inputs.environment }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "### web $TAG → $ENV (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  cd:
    name: web
    needs: resolve
    uses: ./.github/workflows/_cd.yml
    with:
      app: web
      tag: ${{ needs.resolve.outputs.tag }}
      environment: ${{ needs.resolve.outputs.environment }}
      infra_dir: infra/apps/web
      image_repository: adlc-demo/web
    secrets: inherit
