# Generated by slipway for app `web` (runner=github-actions, pr_checks=always-run-gate). Regenerate with the scaffold; do not hand-edit.
# CI of ONE app. It runs when this app's inputs change (the `paths` below are rendered from .slipway/config.yaml and are the
# same list as the pathFilters in apps/web/version.json). The stages live in _ci.yml. Deployment: slipway-demo-web-cd.yml.
name: slipway-demo-web-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/slipway-demo-web-ci.yml"
      - ".github/workflows/slipway-demo-web-cd.yml"
      - ".github/workflows/_ci.yml"
      - ".github/workflows/_cd.yml"
      - "infra/apps/web/**"
  workflow_dispatch:

concurrency:
  group: slipway-demo-web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # the release job creates the tag web/v<version> on main
  id-token: write   # OIDC token for azure/login (no stored cloud credentials)
  pull-requests: read

jobs:
  changes:
    # Always runs on pull requests so the checks below can be required on main: when the PR does not touch
    # this app's inputs, `ci` is skipped, and a conditionally skipped job counts as passed for required status checks.
    name: changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          APP_PATHS: |
            apps/web
            .github/workflows/slipway-demo-web-ci.yml
            .github/workflows/slipway-demo-web-cd.yml
            .github/workflows/_ci.yml
            .github/workflows/_cd.yml
            infra/apps/web
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' > changed.txt
          python3 - <<'PY'
          import os
          paths=[p.strip().rstrip("/") for p in os.environ["APP_PATHS"].splitlines() if p.strip()]
          changed=[l.strip() for l in open("changed.txt") if l.strip()]
          hit=[f for f in changed if any(f==p or f.startswith(p+"/") for p in paths)]
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"run={'true' if hit else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as s:
              s.write(f"### web: {'changed' if hit else 'untouched'} by this pull request ({len(changed)} changed files, {len(hit)} among this app's inputs)\n")
              for f in hit[:20]: s.write(f"- `{f}`\n")
          PY

  ci:
    name: ci
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/_ci.yml
    with:
      app: web
      app_path: apps/web
      context: apps/web
      dockerfile: apps/web/Dockerfile
      image_repository: adlc-demo/web
      test_command: "npm --prefix apps/web test"
      is_dotnet: false
      is_node: true
      tag_prefix: web/v
    secrets: inherit
