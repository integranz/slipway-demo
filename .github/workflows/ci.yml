# Generated by slipway (runner=github-actions, versioning=nbgv). Regenerate with the scaffold; do not hand-edit.
# CI: build, test, compute the version, build images with the version stamped in, push immutable tags on main,
# publish a release manifest. CD is a separate workflow (cd.yml) triggered with an explicit tag.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # nbgv creates the release tag on main
  id-token: write   # OIDC token for azure/login (no stored cloud credentials)
  pull-requests: read

env:
  REGISTRY: acradlcdemo.azurecr.io
  IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the version depends on it
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Compute version with Nerdbank.GitVersioning
        id: nbgv
        uses: dotnet/nbgv@v0.5.2
      - id: v
        run: |
          echo "version=${{ steps.nbgv.outputs.SemVer2 }}" >> "$GITHUB_OUTPUT"
          echo "commit=${{ steps.nbgv.outputs.GitCommitIdShort }}" >> "$GITHUB_OUTPUT"
          echo "public_release=${{ steps.nbgv.outputs.PublicRelease }}" >> "$GITHUB_OUTPUT"
          echo "### Version ${{ steps.nbgv.outputs.SemVer2 }} (public release: ${{ steps.nbgv.outputs.PublicRelease }})" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
      - name: install web dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: test api
        run: dotnet test apps/api
      - name: test web
        run: npm --prefix apps/web test

  images:
    name: image ${{ matrix.app }}
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            path: apps/api
            repository: adlc-demo/api
          - app: web
            path: apps/web
            repository: adlc-demo/web
    outputs:
      digest_api: ${{ steps.build.outputs.digest }}
      digest_web: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Azure login (OIDC)
        if: env.IS_RELEASE == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to the container registry
        if: env.IS_RELEASE == 'true'
        run: az acr login --name acradlcdemo
      - name: Refuse to overwrite an existing tag (tags are immutable)
        if: env.IS_RELEASE == 'true'
        run: |
          if [ -n "$(az acr repository show -n acradlcdemo --image "${{ matrix.repository }}:${{ needs.version.outputs.version }}" --query digest -o tsv 2>/dev/null)" ]; then
            echo "::error::${{ matrix.repository }}:${{ needs.version.outputs.version }} already exists in acradlcdemo. Tags are immutable: bump the version (new commit) instead of re-running a release build."
            exit 1
          fi
      - name: Build${{ env.IS_RELEASE == 'true' && ' and push' || '' }} ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          push: ${{ env.IS_RELEASE == 'true' }}
          load: ${{ env.IS_RELEASE != 'true' }}
          provenance: false   # single image manifest, so the registry digest equals the running image digest
          sbom: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ needs.version.outputs.commit }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.repository }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.repository }}:sha-${{ needs.version.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Record image
        run: |
          mkdir -p manifest
          printf '{"app":"%s","image":"%s","tag":"%s","digest":"%s"}\n' "${{ matrix.app }}" "${{ env.REGISTRY }}/${{ matrix.repository }}" "${{ needs.version.outputs.version }}" "${{ steps.build.outputs.digest }}" > "manifest/${{ matrix.app }}.json"
          echo "- \`${{ env.REGISTRY }}/${{ matrix.repository }}:${{ needs.version.outputs.version }}\` ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.app }}
          path: manifest/
          retention-days: 30

  release:
    name: release ${{ needs.version.outputs.version }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: image-*
          merge-multiple: true
          path: manifest
      - name: Assemble release manifest
        run: |
          python3 - <<'PY'
          import json,glob,os
          images=[json.load(open(f)) for f in sorted(glob.glob("manifest/*.json"))]
          m={"project":"adlc-demo","version":"${{ needs.version.outputs.version }}","commit":"${{ github.sha }}","run_id":"${{ github.run_id }}","images":images}
          json.dump(m,open("release-manifest.json","w"),indent=2); print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ needs.version.outputs.version }}
          path: release-manifest.json
          retention-days: 90
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Tag the release commit
        run: |
          dotnet tool install -g nbgv >/dev/null
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "v${{ needs.version.outputs.version }}" >/dev/null 2>&1; then
            echo "tag v${{ needs.version.outputs.version }} already exists; nothing to do"
          else
            nbgv tag
            git push origin "v${{ needs.version.outputs.version }}"
          fi
      - name: Summary
        run: |
          echo "## Release adlc-demo ${{ needs.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with: \`/slipway:deploy ${{ needs.version.outputs.version }} dev\`" >> "$GITHUB_STEP_SUMMARY"
